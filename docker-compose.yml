services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vave
      POSTGRES_PASSWORD: vave_dev_password
      POSTGRES_DB: vave_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vave -d vave_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://vave:vave_dev_password@db:5432/vave_intelligence
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SEED_DEMO_DATA: "true"
      AI_MODE: fallback
      EMBEDDING_PROVIDER: deterministic
      EMBEDDING_MODEL: deterministic-hash-v1
      OPENAI_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    ports:
      - "11434:11434"

volumes:
  pgdata:
  uploads:
