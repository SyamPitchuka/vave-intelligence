<title id="t">Semantic duplicate threshold sweep, v2 hard set</title>
<desc id="d">Precision, recall and F1 end to end for semantic_duplicate_threshold from 0.70 to 0.95. F1 peaks at 0.82 (0.844). Precision first reaches 1.0 at 0.91.</desc>
